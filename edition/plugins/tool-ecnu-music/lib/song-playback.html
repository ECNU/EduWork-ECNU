<section class="sync-panel card" aria-labelledby="sync-heading">
  <div class="section-top"><div><div class="eyebrow">LIVE / WORDS & MUSIC</div><h2 id="sync-heading">跟着音乐，看见歌词</h2></div><div class="score-tools"><button id="portrait" type="button" aria-pressed="false">竖屏预览</button><button id="follow-lyrics" type="button" aria-pressed="true">跟随歌词 · 开</button></div></div>
  <div class="song-stage" id="song-stage" aria-label="歌曲同步画面">
    <div class="stage-heading"><span>NOW PLAYING</span><strong id="stage-title"></strong></div>
    <div class="stage-lines"><p id="stage-prev" class="stage-neighbor"></p><p id="stage-current">歌词待校时</p><p id="stage-next" class="stage-neighbor"></p></div>
    <div class="stage-footer"><div class="stage-time"><span id="stage-clock">0:00</span><span id="stage-total">—</span></div><div class="stage-progress" role="progressbar" aria-label="歌曲播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="stage-progress-fill"></div></div><span id="stage-caption-state">音乐作品 · 同步预览</span></div>
  </div>
  <div class="stage-controls"><button id="stage-play" type="button">播放</button><input id="stage-seek" type="range" min="0" max="1" step="1" value="0" disabled aria-label="歌曲播放位置"></div>
  <div class="sync-status"><span id="lyrics-sync-state" role="status">歌词待对齐</span><span id="score-sync-state" role="status">乐谱待对齐</span></div>
  <p id="timeline-source" class="score-status"></p>
  <p id="timeline-warning" class="warnings" role="alert" hidden></p>
  <div class="timeline-actions"><label class="file-button">导入字幕 / 时间轴<input id="timeline-import" type="file" accept=".json,.srt,.lrc" aria-label="导入字幕或时间轴"></label><button id="timeline-download" type="button">导出时间轴</button></div>
  <p class="small-note">先试听并核对歌词出现的时机。没有时间轴时保留原歌词与静态谱面；导入的字幕默认作为草稿。校时更改保存在本页，请导出时间轴文件以便复用。</p>
  <details id="timing-editor"><summary>校对歌词时间</summary><p class="small-note">播放到某一句时，可记录开始和结束；也可直接输入秒数。保留前奏与间奏的空隙，未填时间的句子不会参与同步。</p><div class="timing-table-wrap"><table class="timing-table"><thead><tr><th>歌词</th><th>开始（秒）</th><th>结束（秒）</th></tr></thead><tbody id="timing-rows"></tbody></table></div><label class="review-label"><input id="timing-reviewed" type="checkbox">我已试听并核对这些时间</label><button id="timing-apply" type="button">应用校时</button></details>
</section>
<style>
.stage-controls{display:flex;align-items:center;gap:18px;margin-top:16px}.stage-controls input{flex:1;min-width:0;min-height:44px;accent-color:var(--green)}.stage-controls button{min-width:76px}
.sync-panel{margin:0 0 26px}.song-stage{min-height:360px;background:radial-gradient(ellipse at 15% 0%,#396a53 0%,#173f35 50%,#102e29 100%);color:#f5f6df;border-radius:14px;padding:30px 42px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;overflow:hidden}.stage-heading{display:flex;flex-direction:column;gap:8px}.stage-heading span{font-size:10px;letter-spacing:.2em;color:#b8c8ab}.stage-heading strong{font-size:16px;font-weight:500;overflow-wrap:anywhere}.stage-lines{text-align:center;display:flex;flex-direction:column;justify-content:center;gap:14px;flex:1}.stage-lines p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.stage-neighbor{font-size:18px;color:#b6c6bb;min-height:1.6em}.stage-lines #stage-current{font-size:clamp(24px,3.3vw,42px);font-weight:600;line-height:1.55;color:#e9f3ba}.stage-time{display:flex;justify-content:space-between;font-size:11px;font-variant-numeric:tabular-nums;color:#cad6cc}.stage-progress{height:3px;background:#ffffff26;margin:8px 0 12px;overflow:hidden}.stage-progress>div{height:100%;width:100%;background:#d7e9ac;transform:scaleX(0);transform-origin:left}#stage-caption-state{font-size:10px;letter-spacing:.06em;color:#b8c8ab}.song-stage.portrait{width:min(100%,390px);aspect-ratio:9/16;margin:auto;min-height:0;padding:34px 26px}.portrait #stage-current{font-size:28px}.portrait .stage-neighbor{font-size:16px}.sync-status{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.sync-status span{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px}.timeline-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.file-button{display:inline-flex;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-size:14px;cursor:pointer}.file-button:focus-within{outline:3px solid #3b8469;outline-offset:3px}.file-button input{position:absolute;width:1px;height:1px;opacity:0}.timeline-actions button{font-size:14px}.sync-panel .small-note{margin-top:16px;padding-top:12px}.timing-table-wrap{overflow:auto;max-height:420px;margin:16px 0}.timing-table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}.timing-table th,.timing-table td{border-bottom:1px solid var(--line);padding:10px 8px}.timing-table td:first-child{min-width:140px;max-width:340px;overflow-wrap:anywhere}.timing-table input{width:90px;min-height:44px;border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit}.timing-table button{display:block;font-size:11px;padding:7px;margin-top:5px}.review-label{display:flex;align-items:center;gap:8px;font-size:13px;min-height:44px;margin-bottom:8px}.review-label input{width:18px;height:18px}.lyrics p.active-lyric{color:#16483c;background:#e6efd6;border-radius:7px;outline:2px solid #d2e2bc}.lyrics p[data-cue]{cursor:pointer}.score .time-active{fill:#b25818!important;stroke:#b25818!important}.score svg.active-score-line{background:#fbf6df;border-radius:8px}#timing-editor summary{margin-top:12px}
@media(max-width:600px){.song-stage{min-height:410px;padding:24px 20px}.stage-neighbor{font-size:16px}.stage-heading strong{font-size:14px}.sync-panel{padding:20px 16px}.song-stage.portrait{padding:26px 20px}.portrait #stage-current{font-size:24px}.timeline-actions>*{flex:1;justify-content:center;white-space:nowrap}}
@media print{.sync-panel{display:none}.lyrics p.active-lyric{background:none;outline:0}.score .time-active{fill:inherit!important;stroke:inherit!important}.score svg.active-score-line{background:none}}
</style>
