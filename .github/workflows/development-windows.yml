name: Build ECNU desktop release candidates
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved X.Y.Z-dev.YYYYMMDD.N version; artifacts only'
        required: true
        type: string
      release_notes:
        description: 'Approved docs/releases/<version>.md file'
        required: true
        type: string
      notes_approved:
        description: 'The project owner approved this version and release text'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: desktop-candidate-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    # Manual, read-only candidate builds may validate a maintainer-selected branch before merge.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
          - runner: macos-15
            platform: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: institution
          persist-credentials: false
      - name: Read the pinned public core
        id: core
        shell: pwsh
        run: |
          $lock = Get-Content institution/core.lock.json -Raw | ConvertFrom-Json
          if ($lock.repository -ne 'https://github.com/ecnu/EduWork.git' -or $lock.commit -notmatch '^[a-f0-9]{40}$') { throw 'Pin an exact public core commit.' }
          "commit=$($lock.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: ECNU/EduWork
          ref: ${{ steps.core.outputs.commit }}
          path: core
          persist-credentials: false
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build and validate the exact desktop archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_NOTES_APPROVED: ${{ inputs.notes_approved }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_NOTES_APPROVED -ne 'true') { throw 'Release notes approval is required.' }
          node core/scripts/check-source-docs.mjs core
          node core/scripts/check-source-docs.mjs institution
          $script = "./core/scripts/ci-eduwork-$($env:TARGET_PLATFORM)-release.ps1"
          & $script -CoreRoot ./core -EditionRoot ./institution -DistributionConfig edition/distribution.json -Version $env:RELEASE_VERSION -ReleaseNotesFile $env:RELEASE_NOTES -ReleaseNotesApproved -Output "$env:RUNNER_TEMP/ew-candidate"
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-validation
          path: ${{ runner.temp }}/ew-candidate/evidence-public
          retention-days: 7
          if-no-files-found: warn
      - name: Retain candidate files for acceptance before publication
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: ${{ runner.temp }}/ew-candidate/publish
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
