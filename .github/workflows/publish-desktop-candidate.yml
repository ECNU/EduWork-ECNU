name: Publish ECNU desktop candidate
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Existing successful candidate run ID; no local transfer or rebuild'
        required: true
        type: string
      version:
        description: 'Approved product version'
        required: true
        type: string
      release_notes:
        description: 'Approved docs/releases/<version>.md'
        required: true
        type: string
      notes_approved:
        description: 'Project owner approved the version and exact notes'
        required: true
        default: false
        type: boolean
      publish:
        description: 'Publish after validation; false validates artifacts only'
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      version:
        required: true
        type: string
      release_notes:
        required: true
        type: string
      notes_approved:
        required: true
        default: false
        type: boolean
      publish:
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-publication-${{ github.repository }}-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: institution
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Read the pinned publisher implementation
        id: core
        run: |
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('institution/core.lock.json'));if(x.repository.toLowerCase()!=='https://github.com/ecnu/eduwork.git'||!/^[a-f0-9]{40}$/.test(x.commit))throw Error('Invalid core lock');fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+x.commit+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: ECNU/EduWork
          ref: ${{ steps.core.outputs.commit }}
          path: core
          persist-credentials: false
      - name: Verify and optionally publish the existing CI artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_NOTES_APPROVED: ${{ inputs.notes_approved }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          EDITION_ROOT: institution
          HAS_CORE_LOCK: 'true'
          RELEASE_PRODUCT: EduWork-ECNU
          RELEASE_DISTRIBUTION: eduwork-chatecnu
          REQUIRE_PUBLISHER_BOOTSTRAP: 'true'
          CANDIDATE_WORKFLOW: .github/workflows/development-windows.yml
        run: node core/scripts/publish-desktop-candidate.mjs
      - name: Retain publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-publication-verification
          path: ${{ runner.temp }}/desktop-publication-${{ github.run_id }}/publication-verification.json
          retention-days: 30
          if-no-files-found: warn
