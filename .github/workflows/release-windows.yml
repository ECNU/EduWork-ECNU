name: Release EduWork@ECNU Windows Electron
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Product version (X.Y.Z); must match the pinned core'
        required: true
        type: string
      release_notes:
        description: 'Approved notes file in this repository (docs/releases/<version>.md)'
        required: true
        type: string
      notes_approved:
        description: 'These release notes were discussed and approved by the project owner'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      core-commit: ${{ steps.core.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: institution
          persist-credentials: false
      - name: Read the pinned public core
        id: core
        shell: pwsh
        run: |
          $lock = Get-Content institution/core.lock.json -Raw | ConvertFrom-Json
          if ($lock.repository -ne 'https://github.com/ecnu/EduWork.git' -or $lock.commit -notmatch '^[a-f0-9]{40}$') { throw 'Pin an exact EduWork commit.' }
          "commit=$($lock.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: ecnu/EduWork
          ref: ${{ steps.core.outputs.commit }}
          path: core
          persist-credentials: false
          ssh-key: ${{ secrets.EDUWORK_CORE_SSH_KEY }}
          token: ${{ secrets.EDUWORK_CORE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - name: Validate release policy and institution documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node core/scripts/check-source-docs.mjs core
          node core/scripts/check-source-docs.mjs institution
          node --test core/tests/eduwork-windows-release.test.mjs
      - name: Build the institution with the shared npm desktop recipe
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_NOTES_APPROVED: ${{ inputs.notes_approved }}
        run: ./core/scripts/ci-eduwork-windows-release.ps1 -CoreRoot ./core -EditionRoot ./institution -DistributionConfig edition/distribution.json -Version $env:RELEASE_VERSION -ReleaseNotesFile $env:RELEASE_NOTES -ReleaseNotesApproved:($env:RELEASE_NOTES_APPROVED -eq 'true') -Output "$env:RUNNER_TEMP/ew-release"
      - name: Capture startup failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          @'
          import {readFile,writeFile,mkdir} from 'node:fs/promises'
          import {join} from 'node:path'
          import {redactDiagnostic} from './core/dsh-host/diagnostics.mjs'
          const root=join(process.env.RUNNER_TEMP,'ew-release'),out=join(root,'evidence-public')
          await mkdir(out,{recursive:true})
          for(const name of ['app.stdout.log','app.stderr.log','data/logs/desktop-host.log','data/logs/startup-error.log']){
            const text=await readFile(join(root,'evidence/gui',name),'utf8').catch(()=>null)
            if(text)await writeFile(join(out,name.replaceAll('/','-')+'.txt'),redactDiagnostic(text.slice(-200000),{RUNNER:process.env.RUNNER_TEMP,CHECKOUT:process.cwd()}))
          }
          '@ | node --input-type=module
      - name: Retain redacted validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: ${{ runner.temp }}/ew-release/evidence-public
          retention-days: 7
          if-no-files-found: warn
      - name: Transfer validated release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/ew-release/publish
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ecnu/EduWork
          ref: ${{ needs.build.outputs.core-commit }}
          path: core
          persist-credentials: false
          ssh-key: ${{ secrets.EDUWORK_CORE_SSH_KEY }}
          token: ${{ secrets.EDUWORK_CORE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files
      - name: Upload verified assets to a draft, then publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES_APPROVED: ${{ inputs.notes_approved }}
        run: node core/scripts/publish-windows-release.mjs release-files
